# Builds and tests every pull request and push to main, so Dependabot and contributor PRs arrive checked.
# Same steps as the release build, minus MSIX packaging and publishing.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build x64 (tests, trimmed unpackaged build)
        run: ./scripts/build.ps1 -Platform x64 -Unpackaged

      - name: Build ARM64 (trimmed unpackaged build)
        run: ./scripts/build.ps1 -Platform ARM64 -Unpackaged -SkipTests
