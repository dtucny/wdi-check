version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One SDK release ships as several packages; they must move together.
      windows-app-sdk:
        patterns: ["Microsoft.WindowsAppSDK*"]
      tests:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk"]

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
